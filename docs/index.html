<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Mile Calendar</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css">
<style>:root{--ink:#17201e;--paper:#f5f1e8;--accent:#c94f32}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px system-ui,sans-serif}header,main{max-width:1200px;margin:auto;padding:1rem}h1{margin-bottom:.2rem}.controls{display:flex;gap:.6rem;flex-wrap:wrap;margin:1rem 0}select,button{font:inherit;padding:.55rem;border:1px solid #aaa;border-radius:.4rem;background:white}#calendar{background:white;padding:1rem;border-radius:.7rem}.fc-event{cursor:pointer}details{margin-top:1rem;background:#fff;padding:1rem;border-radius:.7rem}.bad{color:#a11}.muted{color:#64706d;font-size:.9rem}@media(max-width:650px){#calendar{padding:.3rem}.fc-toolbar{display:block}.fc-toolbar-chunk{margin:.3rem}}</style></head>
<body><header><h1>Music Mile Calendar</h1><div class="muted" id="updated">Loading events…</div><div class="controls"><label>Venue <select id="venue"><option value="">All venues</option></select></label><button id="today">Today</button></div></header><main><div id="calendar"></div><details><summary>Source status</summary><div id="status"></div></details></main>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script><script>
fetch('events.json?v=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(data=>{document.querySelector('#updated').textContent='Last updated '+new Date(data.generatedAt).toLocaleString();let all=data.events.map(e=>({...e,title:e.title+' — '+e.venue,extendedProps:{venue:e.venue,description:e.description}}));let cal=new FullCalendar.Calendar(document.querySelector('#calendar'),{initialView:innerWidth<650?'listMonth':'dayGridMonth',events:all,eventClick:i=>{if(i.event.url){i.jsEvent.preventDefault();open(i.event.url,'_blank')}}});cal.render();let venues=[...new Set(data.events.map(e=>e.venue))].sort();venue.innerHTML+=[...venues].map(v=>`<option>${v}</option>`).join('');venue.onchange=()=>{let v=venue.value;cal.removeAllEvents();cal.addEventSource(v?all.filter(e=>e.venue===v):all)};today.onclick=()=>cal.today();status.innerHTML=data.sources.map(s=>`<p class="${s.ok?'':'bad'}"><a href="${s.url}">${s.venue}</a>: ${s.ok?s.events+' events found':'update failed — '+s.error}</p>`).join('')}).catch(e=>updated.textContent='Calendar data could not be loaded: '+e);
</script></body></html>
